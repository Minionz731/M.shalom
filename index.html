<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M Shalom Trading - Premium Used Cars Randburg</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <style>
        :root {
            /* Colors */
            --primary: #C9A961;
            --primary-dark: #B39450;
            --bg-black: #0A0A0A;
            --bg-dark: #141414;
            --bg-card: #1C1C1C;
            --bg-elevated: #242424;
            --bg-hover: #2A2A2A;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-tertiary: #808080;
            --text-muted: #606060;
            --border: #2A2A2A;
            --border-light: #333333;
            --success: #10B981;
            --danger: #DC2626;
            
            /* Typography Scale - Systematic */
            --text-display: 56px;
            --text-h1: 40px;
            --text-h2: 32px;
            --text-h3: 24px;
            --text-h4: 18px;
            --text-body: 16px;
            --text-small: 14px;
            --text-caption: 12px;
            
            /* Spacing Scale - 8px Grid */
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 24px;
            --space-lg: 32px;
            --space-xl: 40px;
            --space-2xl: 48px;
            --space-3xl: 64px;
            --space-4xl: 80px;
            --space-5xl: 96px;
            --space-6xl: 120px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-black);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 var(--space-2xl);
        }

        /* Loading Intro - Simplified Professional */
        .loading-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: fadeOut 0.8s ease 1.2s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .logo-simple {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
            opacity: 0;
            animation: logoFade 0.8s ease 0.2s forwards;
        }

        @keyframes logoFade {
            to { opacity: 1; }
        }

        /* Hide gimmicky template elements */
        .logo-animation,
        .logo-outline,
        .logo-text-intro,
        .car-silhouette,
        .headlight-glow,
        .rating,
        .stars,
        .hero-subtitle,
        .stock-badge,
        .in-stock,
        .out-of-stock,
        .header-top,
        .contact-info,
        .contact-item,
        .social-links {
            display: none !important;
        }

        /* Header - Clean Professional */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 64px;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        header.scrolled {
            background: rgba(10, 10, 10, 0.98);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 var(--space-2xl);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .logo:hover {
            opacity: 0.8;
        }

        .logo-image {
            height: 40px;
            width: auto;
        }

        .nav-links {
            display: flex;
            gap: var(--space-2xl);
            list-style: none;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
        }

        .nav-link:hover {
            color: var(--text-primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--text-primary);
            transition: width 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .header-cta {
            padding: 12px 24px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .header-cta:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Admin Icon Button - Subtle */
        .admin-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            opacity: 0.4;
        }

        .admin-icon-btn:hover {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        .admin-icon-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Hero Section - With Video Background */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            padding: calc(var(--space-6xl) + 64px) 0 var(--space-5xl);
            margin-top: 64px;
            position: relative;
            overflow: hidden;
        }

        .hero-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Cover watermark in bottom-right */
        .watermark-cover {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 180px;
            height: 80px;
            background: linear-gradient(to left, rgba(10, 10, 10, 1) 0%, transparent 100%);
            z-index: 1;
        }

        .hero-video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                180deg,
                rgba(10, 10, 10, 0.7) 0%,
                rgba(10, 10, 10, 0.85) 50%,
                rgba(10, 10, 10, 0.95) 100%
            );
            z-index: 2;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 50%, rgba(201, 169, 97, 0.05) 0%, transparent 50%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 var(--space-2xl);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: var(--space-md);
            opacity: 0;
            animation: slideUp 0.8s ease 0.2s forwards;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: var(--text-display);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -1px;
            margin-bottom: var(--space-md);
            color: var(--text-primary);
            opacity: 0;
            animation: slideUp 0.8s ease 0.4s forwards;
            max-width: 800px;
        }

        .hero-description {
            font-size: var(--text-body);
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 500px;
            margin-bottom: var(--space-2xl);
            opacity: 0;
            animation: slideUp 0.8s ease 0.6s forwards;
        }

        .hero-cta {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
            opacity: 0;
            animation: slideUp 0.8s ease 0.8s forwards;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: var(--space-sm) var(--space-lg);
            background: var(--primary);
            color: var(--bg-black);
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(201, 169, 97, 0.25);
        }

        .btn-secondary {
            padding: var(--space-sm) var(--space-lg);
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* Inventory Controls - Clean */
        .inventory-controls {
            margin-bottom: var(--space-6xl);
            padding: var(--space-3xl) 0;
        }

        .search-bar {
            margin-bottom: var(--space-md);
        }

        .search-bar input {
            width: 100%;
            max-width: 600px;
            padding: var(--space-sm) var(--space-lg);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 15px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .filter-pills {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
        }

        .pill {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pill:hover {
            border-color: var(--border-light);
            color: var(--text-primary);
        }

        .pill.active {
            background: var(--bg-elevated);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Advanced Filters Panel */
        .advanced-filters {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: var(--space-lg);
            margin-top: var(--space-md);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-md);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .filter-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .filter-select,
        .filter-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .filter-select:focus,
        .filter-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .filter-select option {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .price-range-inputs {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: var(--space-xs);
            align-items: center;
        }

        .price-separator {
            color: var(--text-muted);
            font-size: 14px;
        }

        .filter-actions {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }

        .btn-filter {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-filter:hover {
            border-color: var(--border-light);
            color: var(--text-primary);
        }

        .btn-filter-clear {
            color: var(--text-muted);
        }

        .btn-filter-clear:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .filter-toggle {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: var(--space-md);
        }

        .filter-toggle:hover {
            border-color: var(--border-light);
            color: var(--text-primary);
        }

        .filter-toggle.active {
            border-color: var(--primary);
            color: var(--primary);
        }

        .results-count {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: var(--space-md);
        }

        .results-count strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Inventory Section */
        .inventory-section {
            padding: var(--space-6xl) 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: var(--space-6xl);
        }

        .section-subtitle {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: var(--space-md);
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: var(--text-h1);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: var(--space-lg);
            line-height: 1.2;
        }

        .section-description {
            font-size: var(--text-body);
            line-height: 1.6;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: var(--space-lg);
            margin-bottom: var(--space-4xl);
        }

        .vehicle-card {
            background: var(--bg-card);
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .vehicle-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-light);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        }

        .vehicle-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: var(--bg-elevated);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vehicle-card:hover .vehicle-image {
            transform: scale(1.05);
        }

        .vehicle-content {
            padding: var(--space-lg);
        }

        .vehicle-header {
            margin-bottom: var(--space-md);
        }

        .vehicle-title {
            font-size: var(--text-h3);
            font-weight: 600;
            margin-bottom: var(--space-xs);
            letter-spacing: -0.3px;
            line-height: 1.3;
        }

        .vehicle-price {
            font-family: 'Playfair Display', serif;
            font-size: var(--text-h2);
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .vehicle-meta {
            font-size: var(--text-small);
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--border);
        }

        .vehicle-description {
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
            font-size: 14px;
            line-height: 1.6;
        }

        .vehicle-image-count {
            color: var(--primary);
            margin-bottom: var(--space-md);
            font-size: 12px;
            text-align: center;
        }

        .btn-vehicle-cta {
            width: 100%;
            padding: var(--space-sm);
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-vehicle-cta:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Loading States */
        .loading-spinner {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Admin Panel */
        .admin-panel {
            min-height: 100vh;
            padding: var(--space-4xl) 0;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-4xl);
        }

        .btn-logout {
            background: var(--danger);
            color: white;
        }

        .btn-logout:hover {
            background: #DC2626;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: var(--space-2xl);
            margin-bottom: var(--space-4xl);
        }

        .admin-form {
            background: var(--bg-card);
            padding: var(--space-2xl);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: var(--space-lg);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--space-xs);
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .admin-table {
            width: 100%;
            background: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-dark);
        }

        th {
            padding: var(--space-md);
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: var(--space-md);
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        tbody tr:hover {
            background: var(--bg-hover);
        }

        .action-buttons {
            display: flex;
            gap: var(--space-xs);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Login Form */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: var(--bg-card);

        .whatsapp-float:hover {

        }

            display: grid;

        }

        .config-code {

        /* Responsive */
        @media (max-width: 1024px) {

                max-width: 100%;

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ===== FIREBASE CONFIGURATION =====
        const firebaseConfig = {
            apiKey: "AIzaSyAmTpHi_6bX916qm4KgyP8YP4qQWNHIYG4",
            authDomain: "m-shalom-trading.firebaseapp.com",
            databaseURL: "https://m-shalom-trading-default-rtdb.firebaseio.com",
            projectId: "m-shalom-trading",
            storageBucket: "m-shalom-trading.firebasestorage.app",
            messagingSenderId: "5862123065",
            appId: "1:5862123065:web:2e2e3caa68511b1a5ecfe8"
        };

        const isFirebaseConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY_HERE";

        let database, storage;
        if (isFirebaseConfigured) {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            storage = firebase.storage();
        }

        const initialInventory = [
            {
                id: 1,
                make: "BMW",
                model: "3 Series",
                year: 2019,
                price: 450000,
                mileage: 45000,
                transmission: "Automatic",
                fuelType: "Petrol",
                quantity: 2,
                images: ["https://images.unsplash.com/photo-1555215695-3004980ad54e?w=800&h=600&fit=crop"],
                description: "Luxury sedan in excellent condition"
            }
        ];

        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [isAdmin, setIsAdmin] = useState(false);
            const [inventory, setInventory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCar, setSelectedCar] = useState(null);
            const [showAdvancedFilters, setShowAdvancedFilters] = useState(false);
            
            // Advanced filter state
            const [filters, setFilters] = useState({
                minPrice: '',
                maxPrice: '',
                make: '',
                model: '',
                minYear: '',
                maxYear: '',
                transmission: '',
                fuelType: ''
            });

            useEffect(() => {
                if (!isFirebaseConfigured) {
                    setInventory(initialInventory);
                    setLoading(false);
                    return;
                }

                const inventoryRef = database.ref('inventory');

                // Fallback timeout so site never gets stuck loading
                const loadingTimeout = setTimeout(() => {
                    setInventory(initialInventory);
                    setLoading(false);
                }, 5000);
                
                inventoryRef.on('value', (snapshot) => {
                    clearTimeout(loadingTimeout);
                    const data = snapshot.val();
                    if (data) {
                        const inventoryArray = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        setInventory(inventoryArray);
                    } else {
                        setInventory(initialInventory);
                    }
                    setLoading(false);
                }, (error) => {
                    console.error('Firebase loading error:', error);
                    clearTimeout(loadingTimeout);
                    setInventory(initialInventory);
                    setLoading(false);
                });

                return () => {
                    clearTimeout(loadingTimeout);
                    inventoryRef.off();
                };
            }, []);

            // Secret admin access via URL hash
            useEffect(() => {
                const checkHash = () => {
                    if (window.location.hash === '#admin-login') {
                        setCurrentView('admin-login');
                    }
                };
                
                checkHash();
                window.addEventListener('hashchange', checkHash);
                
                return () => window.removeEventListener('hashchange', checkHash);
            }, []);

            const filteredInventory = inventory.filter(car => {
                if (car.quantity === 0) return false;
                
                // Search term filter
                const matchesSearch = !searchTerm || 
                    `${car.make} ${car.model}`.toLowerCase().includes(searchTerm.toLowerCase());
                
                // Price filters
                const matchesMinPrice = !filters.minPrice || car.price >= parseInt(filters.minPrice);
                const matchesMaxPrice = !filters.maxPrice || car.price <= parseInt(filters.maxPrice);
                
                // Make/Model filters
                const matchesMake = !filters.make || car.make.toLowerCase() === filters.make.toLowerCase();
                const matchesModel = !filters.model || car.model.toLowerCase().includes(filters.model.toLowerCase());
                
                // Year filters
                const matchesMinYear = !filters.minYear || car.year >= parseInt(filters.minYear);
                const matchesMaxYear = !filters.maxYear || car.year <= parseInt(filters.maxYear);
                
                // Transmission/Fuel filters
                const matchesTransmission = !filters.transmission || car.transmission === filters.transmission;
                const matchesFuelType = !filters.fuelType || car.fuelType === filters.fuelType;
                
                return matchesSearch && matchesMinPrice && matchesMaxPrice && matchesMake && 
                       matchesModel && matchesMinYear && matchesMaxYear && matchesTransmission && matchesFuelType;
            });

            const clearFilters = () => {
                setFilters({
                    minPrice: '',
                    maxPrice: '',
                    make: '',
                    model: '',
                    minYear: '',
                    maxYear: '',
                    transmission: '',
                    fuelType: ''
                });
                setSearchTerm('');
            };

            if (!isFirebaseConfigured) {
                return <ConfigWarning />;
            }

            if (currentView === 'admin-login') {
                return <AdminLogin onLogin={() => { setIsAdmin(true); setCurrentView('admin'); }} />;
            }

            if (currentView === 'admin' && isAdmin) {
                return <AdminPanel 
                    inventory={inventory}
                    onLogout={() => { setIsAdmin(false); setCurrentView('home'); }}
                />;
            }

            if (loading) {
                return (
                    <>
                        <Header onAdminClick={() => setCurrentView('admin-login')} />
                        <div className="loading-spinner">
                            <div className="spinner"></div>
                            <p style={{marginTop: '20px'}}>Loading inventory...</p>
                        </div>
                    </>
                );
            }

            return (
                <>
                    <Header onAdminClick={() => setCurrentView('admin-login')} />
                    <Hero />
                    <div className="container">
                        <InventoryControls 
                            searchTerm={searchTerm} 
                            setSearchTerm={setSearchTerm}
                            filters={filters}
                            setFilters={setFilters}
                            showAdvancedFilters={showAdvancedFilters}
                            setShowAdvancedFilters={setShowAdvancedFilters}
                            clearFilters={clearFilters}
                            resultCount={filteredInventory.length}
                            inventory={inventory}
                        />
                    </div>
                    <InventorySection cars={filteredInventory} onCarClick={setSelectedCar} />
                    <Footer />
                    <WhatsAppFloat />
                    {selectedCar && (
                        <CarModal car={selectedCar} onClose={() => setSelectedCar(null)} />
                    )}
                    )
                </>
            );
        }

        function ConfigWarning() {
            return (
                <div className="config-warning">
                    <div className="config-warning-box">
                        <h2>⚠️ FIREBASE NOT CONFIGURED</h2>
                        <p>
                            This website requires Firebase to store inventory data across all devices.
                        </p>
                        <p>
                            Please follow the <strong>FIREBASE-SETUP-GUIDE.md</strong> to:
                        </p>
                        <ol>
                            <li>Create a free Firebase account</li>
                            <li>Set up a new Firebase project</li>
                            <li>Get your configuration values</li>
                            <li>Replace the config in this HTML file</li>
                        </ol>
                        <div className="config-code">
                            Look for <code>firebaseConfig</code> in the HTML file and update it with your values.
                        </div>
                    </div>
                </div>
            );
        }

        function Header({ onAdminClick }) {
            return (
                <header>
                    <div className="header-content">
                        <a href="#" className="logo"><img src="m.shalom.png" alt="M Shalom Trading Logo" className="logo-image" /></a>
                        <nav>
                            <ul className="nav-links">
                                <li><a href="#" className="nav-link">Home</a></li>
                                <li><a href="#inventory" className="nav-link">Inventory</a></li>
                                <li><a href="#contact" className="nav-link">Contact</a></li>
                            </ul>
                        </nav>
                        {/* Discreet user icon - replaces phone number */}
                        <button 
                            onClick={onAdminClick}
                            className="header-cta"
                            style={{
                                background: 'transparent',
                                border: '1px solid var(--border-light)',
                                padding: '10px 14px',
                                cursor: 'pointer',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '0'
                            }}
                            title="Admin Access"
                        >
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </button>
                    </div>
                </header>
            );
        }

        function Hero() {
            return (
                <section className="hero">
                    {/* Video Background */}
                    <video 
                        className="hero-video-bg" 
                        autoPlay 
                        loop 
                        muted 
                        playsInline
                    >
                        <source src="./herocar.mp4" type="video/mp4" />
                    </video>
                    <div className="watermark-cover"></div>
                    <div className="hero-video-overlay"></div>
                    
                    <div className="container">
                        <div className="hero-content animate-in">
                            <div className="hero-eyebrow">Randburg's Premier Dealership</div>
                            <h1>Quality vehicles.<br/>Trusted service.</h1>
                            <p className="hero-description">
                                Hand-selected inventory. Transparent pricing. Professional service since 2010.

        function CarModal({ car, onClose }) {
            const [currentImageIndex, setCurrentImageIndex] = useState(0);

                const handleEscape = (e) => {
                    if (e.key === 'Escape') onClose();
                };
                const handleArrows = (e) => {
                    if (e.key === 'ArrowLeft') handlePrevious();
                    if (e.key === 'ArrowRight') handleNext();
                };
                document.addEventListener('keydown', handleEscape);
                document.addEventListener('keydown', handleArrows);
                document.body.style.overflow = 'hidden';
                
                return () => {
                    document.removeEventListener('keydown', handleEscape);
                    document.removeEventListener('keydown', handleArrows);
                    document.body.style.overflow = 'auto';

            }, []);

            const handleNext = () => {
                setCurrentImageIndex((prev) => (prev + 1) % images.length);

        function AdminPanel({ inventory, onLogout }) {
            const [formData, setFormData] = useState({
                make: '',
                model: '',
                year: new Date().getFullYear(),
                price: '',
                mileage: '',
                transmission: 'Automatic',
                fuelType: 'Petrol',
                quantity: 1,
                images: [],
                description: ''
            });
            const [editingId, setEditingId] = useState(null);
            const [isDragging, setIsDragging] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploading, setUploading] = useState(false);

            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files);
                processFiles(files);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragging(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setIsDragging(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                const files = Array.from(e.dataTransfer.files);
                processFiles(files);
            };

            const processFiles = async (files) => {
                const imageFiles = files.filter(file => file.type.startsWith('image/'));
                const remainingSlots = 6 - formData.images.length;
                
                if (remainingSlots === 0) {
                    alert('Maximum 6 images allowed');
                    return;
                }

                const filesToProcess = imageFiles.slice(0, remainingSlots);
                setUploading(true);
                
                for (let i = 0; i < filesToProcess.length; i++) {
                    const file = filesToProcess[i];
                    
                    if (file.size > 5 * 1024 * 1024) {
                        alert(`${file.name} is too large. Maximum 5MB per image.`);
                        continue;
                    }

                    try {
                        const timestamp = Date.now();
                        const fileName = `${timestamp}_${file.name}`;
                        const storageRef = storage.ref(`vehicles/${fileName}`);
                        
                        const uploadTask = storageRef.put(file);
                        
                        await new Promise((resolve, reject) => {
                            uploadTask.on('state_changed',
                                (snapshot) => {
                                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                                    setUploadProgress(progress);
                                },
                                (error) => {
                                    console.error('Upload error:', error);
                                    reject(error);
                                },
                                async () => {
                                    const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                                    setFormData(prev => ({
                                        ...prev,
                                        images: [...prev.images, downloadURL]
                                    }));
                                    resolve();
                                }
                            );
                        });
                    } catch (error) {
                        console.error('Error uploading image:', error);
                        alert(`Failed to upload ${file.name}`);
                    }
                }
                
                setUploading(false);
                setUploadProgress(0);
            };

            const removeImage = async (index, imageUrl) => {
                try {
                    if (imageUrl.includes('firebasestorage')) {
                        const imageRef = storage.refFromURL(imageUrl);
                        await imageRef.delete();
                    }
                } catch (error) {
                    console.error('Error deleting image:', error);
                }
                
                setFormData(prev => ({
                    ...prev,
                    images: prev.images.filter((_, i) => i !== index)
                }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (formData.images.length === 0) {
                    alert('Please add at least one image');
                    return;
                }
                
                const carData = {
                    ...formData,
                    price: parseFloat(formData.price),
                    mileage: parseInt(formData.mileage),
                    year: parseInt(formData.year),
                    quantity: parseInt(formData.quantity),
                    createdAt: Date.now()
                };

                try {
                    if (editingId) {
                        await database.ref(`inventory/${editingId}`).update(carData);
                        setEditingId(null);
                    } else {
                        await database.ref('inventory').push(carData);
                    }

                    setFormData({
                        make: '',
                        model: '',
                        year: new Date().getFullYear(),
                        price: '',
                        mileage: '',
                        transmission: 'Automatic',
                        fuelType: 'Petrol',
                        quantity: 1,
                        images: [],
                        description: ''
                    });

                    alert('Vehicle saved successfully!');
                } catch (error) {
                    console.error('Error saving vehicle:', error);
                    alert('Failed to save vehicle. Please try again.');
                }
            };

            const handleEdit = (car) => {
                setFormData({
                    make: car.make,
                    model: car.model,
                    year: car.year,
                    price: car.price,
                    mileage: car.mileage,
                    transmission: car.transmission,
                    fuelType: car.fuelType,
                    quantity: car.quantity,
                    images: car.images || [],
                    description: car.description
                });
                setEditingId(car.id);
            };

            const handleDelete = async (id, images) => {
                if (!confirm('Are you sure you want to delete this vehicle?')) return;
                
                try {
                    if (images && images.length > 0) {
                        for (const imageUrl of images) {
                            if (imageUrl.includes('firebasestorage')) {
                                const imageRef = storage.refFromURL(imageUrl);
                                await imageRef.delete();
                            }
                        }
                    }
                    
                    await database.ref(`inventory/${id}`).remove();
                    alert('Vehicle deleted successfully!');
                } catch (error) {
                    console.error('Error deleting vehicle:', error);
                    alert('Failed to delete vehicle. Please try again.');
                }
            };

            const adjustQuantity = async (id, change) => {
                const car = inventory.find(c => c.id === id);
                const newQuantity = Math.max(0, car.quantity + change);
                
                try {
                    await database.ref(`inventory/${id}`).update({ quantity: newQuantity });
                } catch (error) {
                    console.error('Error updating quantity:', error);
                }
            };

            return (
                <div className="admin-panel">

                                Logout
                            </button>
                        </div>

                        <div className="admin-grid">

                                    {editingId ? 'Edit Vehicle' : 'Add New Vehicle'}
                                </h3>

                                    <div className="form-group">
                                        <label>Make</label>
                                        <input 
                                            type="text" 
                                            className="form-input"
                                            value={formData.make}
                                            onChange={(e) => setFormData({...formData, make: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Model</label>
                                        <input 
                                            type="text" 
                                            className="form-input"
                                            value={formData.model}
                                            onChange={(e) => setFormData({...formData, model: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Year</label>
                                        <input

                                    </div>
                                    <div className="form-group">
                                        <label>Quantity</label>
                                        <input 
                                            type="number" 
                                            className="form-input"
                                            value={formData.quantity}
                                            onChange={(e) => setFormData({...formData, quantity: e.target.value})}
                                            min="0"
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Vehicle Images (Max 6)</label>
                                        <div 
                                            className={`image-upload-area ${isDragging ? 'drag-over' : ''}`}
                                            onClick={() => !uploading && document.getElementById('imageInput').click()}
                                            onDragOver={handleDragOver}
                                            onDragLeave={handleDragLeave}
                                            onDrop={handleDrop}
                                        >
                                            <div className="upload-icon">📸</div>
                                            <p style={{color: 'var(--text-secondary)', marginBottom: '8px'}}>
                                                {uploading ? 'Uploading...' : 'Click to upload or drag & drop'}
                                            </p>
                                            <p style={{color: 'var(--text-secondary)', fontSize: '13px'}}>
                                                JPG, PNG, GIF (max 5MB each)
                                            </p>
                                            <input 
                                                id="imageInput"
                                                type="file" 
                                                accept="image/*"
                                                multiple
                                                style={{display: 'none'}}
                                                onChange={handleFileSelect}
                                                disabled={uploading}
                                            />
                                        </div>
                                        {uploading && (
                                            <div className="upload-progress">
                                                <div className="progress-bar">
                                                    <div className="progress-fill" style={{width: `${uploadProgress}%`}}></div>
                                                </div>
                                                <p className="progress-text">Uploading... {Math.round(uploadProgress)}%</p>
                                            </div>
                                        )}
                                        {formData.images.length > 0 && (
                                            <>
                                                <div className="preview-grid">
                                                    {formData.images.map((img, index) => (
                                                        <div key={index} className="preview-item">
                                                            <img src={img} alt={`Preview ${index + 1}`} className="preview-image" />
                                                            <button 
                                                                type="button"
                                                                className="preview-remove"
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    removeImage(index, img);
                                                                }}
                                                            >
                                                                ×
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className={`image-count ${formData.images.length >= 6 ? 'limit-reached' : ''}`}>
                                                    {formData.images.length} of 6 images uploaded
                                                    {formData.images.length >= 6 && ' (Maximum reached)'}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                    <div className="form-group">
                                        <label>Description</label>
                                        <textarea 
                                            className="form-textarea"
                                            value={formData.description}
                                            onChange={(e) => setFormData({...formData, description: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="btn btn-primary" disabled={formData.images.length === 0 || uploading}>
                                        {editingId ? 'Update Vehicle' : 'Add Vehicle'}
                                        {formData.images.length === 0 && ' (Add at least 1 image)'}
                                    </button>
                                    {editingId && (
                                        <button 
                                            type="button" 
                                            className="btn btn-danger" 
                                            style={{marginTop: '8px'}}
                                            onClick={() => {
                                                setEditingId(null);
                                                setFormData({
                                                    make: '',
                                                    model: '',
                                                    year: new Date().getFullYear(),
                                                    price: '',
                                                    mileage: '',
                                                    transmission: 'Automatic',
                                                    fuelType: 'Petrol',
                                                    quantity: 1,
                                                    images: [],
                                                    description: ''
                                                });
                                            }}
                                        >
                                            Cancel Edit
                                        </button>
                                    )}
                                </form>
                            </div>

                            <div className="admin-table">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Vehicle</th>
                                            <th>Price</th>
                                            <th>Quantity</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {inventory.map(car => (
                                            <tr key={car.id}>
                                                <td>
                                                    <div>
                                                        <strong>{car.year} {car.make} {car.model}</strong>
                                                        <br/>
                                                        <small style={{color: 'var(--text-secondary)'}}>
                                                            {car.mileage.toLocaleString()}km · {car.transmission} · {car.fuelType}
                                                        </small>
                                                        <br/>
                                                        <small style={{color: 'var(--primary)'}}>
                                                            📸 {car.images ? car.images.length : 0} image(s)
                                                        </small>
                                                    </div>
                                                </td>
                                                <td>R {car.price.toLocaleString()}</td>
                                                <td>
                                                    <div className="action-buttons">
                                                        <button 
                                                            className="btn btn-small btn-danger"
                                                            onClick={() => adjustQuantity(car.id, -1)}
                                                            disabled={car.quantity === 0}
                                                        >
                                                            -
                                                        </button>
                                                        <span style={{padding: '6px 12px'}}>{car.quantity}</span>
                                                        <button 
                                                            className="btn btn-small btn-success"
                                                            onClick={() => adjustQuantity(car.id, 1)}
                                                        >
                                                            +
                                                        </button>
                                                    </div>
                                                </td>
                                                <td>
                                                    <div className="action-buttons">
                                                        <button 
                                                            className="btn btn-small btn-primary"
                                                            onClick={() => handleEdit(car)}
                                                        >
                                                            Edit
                                                        </button>
                                                        <button 
                                                            className="btn btn-small btn-danger"
                                                            onClick={() => handleDelete(car.id, car.images)}
                                                        >
                                                            Delete
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Footer() {
            return (
                <footer id="contact">
                    <div className="container">
                        <div className="footer-content">
                            <div className="footer-section">
                                <h3>M Shalom Trading</h3>
                                <p>Your trusted partner for quality used vehicles in Randburg.</p>
                                <p>Serving customers with integrity and excellence since 2010.</p>
                            </div>
                            <div className="footer-section">
                                <h3>Contact</h3>
                                <p style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                                    </svg>
                                    064 643 0253
                                </p>
                                <p style={{display: 'flex', alignItems: 'center', gap: '8px'}}>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                        <circle cx="12" cy="10" r="3"></circle>
                                    </svg>
                                    407 Eton Ave, Ferndale
                                </p>
                                <p style={{paddingLeft: '24px'}}>Randburg, 2194</p>
                            </div>
                            <div className="footer-section">
                                <h3>Follow Us</h3>
                                <a href="https://www.tiktok.com/@m.shalom.trading" target="_blank">TikTok</a>
                                <a href="https://www.facebook.com/people/M-shalom-Trading/" target="_blank">Facebook</a>
                                <a href="https://www.instagram.com/mshalom_trading/" target="_blank">Instagram</a>
                            </div>

                            <div className="footer-section">
                                <h3>Hours</h3>
                                <p>Monday - Friday: 8am - 5pm</p>
                                <p>Saturday: 8am - 3pm</p>
                                <p>Sunday: Closed</p>
                            </div>
                        </div>
                        <div className="footer-bottom">
                            <p>&copy; 2024 M Shalom Trading. All rights reserved.</p>
                        </div>
                    </div>
                </footer>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
